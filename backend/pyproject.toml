[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anamnesis-backend"
version = "0.1.0"
description = "FHIR augmentation MCP server: clinical-note to FHIR pipeline with human-in-the-loop review."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Zelong Wang", email = "zelongw@usc.edu" }]
keywords = ["fhir", "mcp", "clinical-nlp", "healthcare", "llm", "us-core", "mcode"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.19",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "google-genai>=1.51",
    "mcp>=1.9",
    "fastmcp[apps]>=3.2.4",
    "prefab-ui>=0.20.2",
    "pyjwt[crypto]>=2.10",
    "fhir.resources>=7.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9", "mypy>=1.13"]

[project.urls]
Homepage = "https://github.com/Wzelong/anamnesis"
Repository = "https://github.com/Wzelong/anamnesis"
Issues = "https://github.com/Wzelong/anamnesis/issues"

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "db*", "fhir*", "context*", "mcp_server*", "scripts*", "services*"]
exclude = ["tests*"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
exclude = ["mcp_server/ui/", "tests/"]
